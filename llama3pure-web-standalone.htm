    <style>
      body {
        background-color: #000;
      }
      #container {
        display: none;
      }
      .pleasewait {
        position: fixed;
        width: 64px;
        height: 64px;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        margin: auto auto;
        border: 0;
      }
      .lds-spinner {
        color: #fff;
        display: inline-block;
        position: relative;
        width: 64px;
        height: 64px;
      }
      .lds-spinner div {
        transform-origin: 32px 32px;
        animation: lds-spinner 1.2s linear infinite;
      }
      .lds-spinner div:after {
        content: " ";
        display: block;
        position: absolute;
        top: 3px;
        left: 29px;
        width: 5px;
        height: 14px;
        border-radius: 20%;
        background: #fff;
      }
      .lds-spinner div:nth-child(1) {
        transform: rotate(0deg);
        animation-delay: -1.1s;
      }
      .lds-spinner div:nth-child(2) {
        transform: rotate(30deg);
        animation-delay: -1s;
      }
      .lds-spinner div:nth-child(3) {
        transform: rotate(60deg);
        animation-delay: -0.9s;
      }
      .lds-spinner div:nth-child(4) {
        transform: rotate(90deg);
        animation-delay: -0.8s;
      }
      .lds-spinner div:nth-child(5) {
        transform: rotate(120deg);
        animation-delay: -0.7s;
      }
      .lds-spinner div:nth-child(6) {
        transform: rotate(150deg);
        animation-delay: -0.6s;
      }
      .lds-spinner div:nth-child(7) {
        transform: rotate(180deg);
        animation-delay: -0.5s;
      }
      .lds-spinner div:nth-child(8) {
        transform: rotate(210deg);
        animation-delay: -0.4s;
      }
      .lds-spinner div:nth-child(9) {
        transform: rotate(240deg);
        animation-delay: -0.3s;
      }
      .lds-spinner div:nth-child(10) {
        transform: rotate(270deg);
        animation-delay: -0.2s;
      }
      .lds-spinner div:nth-child(11) {
        transform: rotate(300deg);
        animation-delay: -0.1s;
      }
      .lds-spinner div:nth-child(12) {
        transform: rotate(330deg);
        animation-delay: 0s;
      }
      @keyframes lds-spinner {
        0% {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
    </style>

          var data = e.data
          switch (data.type) {
            case "progress":
              // loading...
              var replyCounter = document.getElementsByClassName("reply").length - 1
              lastReply = document.getElementsByClassName("reply")[replyCounter]
              break

            case "loaded":
              var content = document.querySelector(".content")
              var inputContainer = document.querySelector(".input_container")
              var inputTextbox = document.querySelector(".input_textbox")
              var uploader = document.querySelector('input[type="file"]')
              var labelDisclaimer = document.querySelector(".disclaimer")

              while (content.firstChild) {
                content.removeChild(content.firstChild)
              }

              inputTextbox.disabled = false
              inputContainer.style.display = "flex"

              labelDisclaimer.style.display = "block"
              labelDisclaimer.innerText = t("disclaimer")

              document.addEventListener("keydown", function (event) {
                var KEY_CTRL = event.ctrlKey || event.metaKey
                var KEY_1 = event.code === "Digit1"
                var KEY_2 = event.code === "Digit2"
                var KEY_3 = event.code === "Digit3"

                if (KEY_CTRL && KEY_1) {
                  event.preventDefault()
                  try {
                    document.querySelectorAll(".actions_container button")[0].click()
                  } catch (err) {
                    //
                  }
                }

                if (KEY_CTRL && KEY_2) {
                  event.preventDefault()
                  try {
                    document.querySelectorAll(".actions_container button")[1].click()
                  } catch (err) {
                    //
                  }
                }

                if (KEY_CTRL && KEY_3) {
                  event.preventDefault()
                  try {
                    document.querySelectorAll(".actions_container button")[2].click()
                  } catch (err) {
                    //
                  }
                }
              })

              resizeInputText()

              chatHistory.push({ type: "system", text: t("system_prompt") })

              appendMessage("reply", markdownToHTML(t("system_welcome")))
              document.querySelector(".announcer").innerText = t("system_welcome")

              if (!isMobileDevice()) {
                inputTextbox.focus()
              }

              uploader.value = null
              break

            case "token":
              // the first token means the reply started
              if (reply === "") {
                document.title = t("title") + " - " + t("writing")
              }
              reply = reply + data.token
              break

            case "complete":
              // a null reply means that the prompt didn't fit in the context: the
              // reply is the error, with the token counts sent by the engine
              if (data.output === null) {
                reply = t("error_context")
                  .replace("{prompt}", data.promptTokens)
                  .replace("{limit}", data.tokenLimit)
              }

              // the last tokens are shown right away
              window.cancelAnimationFrame(replyFrame)
              if (renderedReplyLength !== reply.length) {
                renderReply()
              }
              handleReply(
                document.querySelector(".content"),
                reply,
                lastReply,
                lastPrompt
              )
              break
          }
        })
      }

      function initialize(data) {
        var content = document.querySelector(".content")

        var loadingMessage = document.createElement("span")
        loadingMessage.className = "reply"
        loadingMessage.innerText = t("loading")

        while (content.firstChild) {
          content.removeChild(content.firstChild)
        }
        content.appendChild(loadingMessage)

        var isBuffer = data instanceof ArrayBuffer
        var dataSize = isBuffer ? data.byteLength : data[0].size

        if (dataSize >= 2147483648) {
          loadingMessage.innerText = t("error_filesize")
          return
        }

        initWorker()

        function sendToWorker(arrayBuffer) {
          worker.postMessage(
            {
              type: "load",
              model: arrayBuffer,
              maxTokens: MAX_TOKENS,
              contextSize: CONTEXT_SIZE,
              temperature: TEMPERATURE,
              topP: TOP_P,
              topK: TOP_K,
            },
            [arrayBuffer]
          )
        }

        if (isBuffer) {
          sendToWorker(data)
        } else {
          var reader = new FileReader()

          reader.addEventListener("load", function (event) {
            sendToWorker(event.target.result)
          })

          reader.readAsArrayBuffer(data[0])
        }
      }

      function createComponent(tag, className, innerHTML, innerText) {
        var element = document.createElement(tag)
        element.className = className || ""
        element.innerHTML = innerHTML || ""
        if (innerText) {
          element.innerText = innerText
        }
        return element
      }

      function appendMessage(className, innerHTML) {
        var content = document.querySelector(".content")
        var message = createComponent("span", className, innerHTML)
        // a screen reader says who wrote each message
        message.setAttribute("role", "article")
        message.setAttribute("aria-label", t("title"))
        content.appendChild(message)
        return message
      }

      function closeThemeMenu() {
        document.querySelector(".theme_overlay").classList.remove("active")
        document
          .querySelector(".header_theme")
          .setAttribute("aria-expanded", "false")
      }

      function checkThemeOption(option) {
        // the chosen option of a group is the checked one, and a screen reader says it
        var options = option.parentNode.children
        for (var i = 0; i < options.length; i++) {
          options[i].setAttribute("aria-checked", options[i] === option)
        }
        document.querySelector(".announcer").innerText =
          option.parentNode.previousElementSibling.innerText + " " + option.innerText
      }

      function showToast(text) {
        var toast = document.querySelector(".toast")

        toast.innerText = text
        toast.classList.add("active")

        clearTimeout(toastTimeout)
        toastTimeout = setTimeout(function () {
          toast.classList.remove("active")
        }, 2000)
      }

      function copyToClipboard(element, button) {
        if (navigator.clipboard) {
          // the clipboard api only exists in secure contexts (https or localhost)
          navigator.clipboard.writeText(element.innerText).then(
            function () {
              showToast(t("copied"))
            },
            function (_err) {
              // e.g. the browser didn't allow the copy
              showToast(t("copy_error"))
            }
          )
        } else {
          // legacy copy for the insecure contexts (plain http), where the clipboard
          // api doesn't exist. execCommand copies the current selection, so the
          // element is selected first and unselected afterwards
          var selection = window.getSelection()
          var range = document.createRange()

          range.selectNodeContents(element)
          selection.removeAllRanges()
          selection.addRange(range)

          try {
            if (document.execCommand("copy")) {
              showToast(t("copied"))
            } else {
              showToast(t("copy_error"))
            }
          } catch (err) {
            showToast(t("copy_error"))
          }

          selection.removeAllRanges()
        }

        if (!isMobileDevice()) {
          button.blur()
        }
      }

      function patchDOM(target, newHTML, start) {
        var temp = document.createElement("div")
        temp.innerHTML = newHTML
        reconcileChildren(target, temp, start)
      }

      function reconcileChildren(existing, updated, start) {
        // the children before start (e.g. the lines of the reply that are already
        // finished) are left as they are
        var existingChildren = Array.prototype.slice.call(existing.childNodes, start)
        var updatedChildren = Array.prototype.slice.call(updated.childNodes)

        for (var i = 0; i < updatedChildren.length; i++) {
          if (i < existingChildren.length) {
            reconcileNode(existing, existingChildren[i], updatedChildren[i])
          } else {
            existing.appendChild(updatedChildren[i].cloneNode(true))
          }
        }

        for (var i = existingChildren.length - 1; i >= updatedChildren.length; i--) {
          existing.removeChild(existingChildren[i])
        }
      }

      function reconcileNode(parent, existingNode, newNode) {
        // a node that is already the same (e.g. a line or a button that didn't change) is
        // left as it is, without comparing its attributes and children one by one
        if (existingNode.isEqualNode(newNode)) {
          return
        }

        if (
          existingNode.nodeType !== newNode.nodeType ||
          existingNode.nodeName !== newNode.nodeName
        ) {
          parent.replaceChild(newNode.cloneNode(true), existingNode)
          return
        }

        if (existingNode.nodeType === Node.TEXT_NODE) {
          if (existingNode.textContent !== newNode.textContent) {
            existingNode.textContent = newNode.textContent
          }
          return
        }

        if (existingNode.nodeType === Node.ELEMENT_NODE) {
          var existingAttrs = existingNode.attributes
          var newAttrs = newNode.attributes

          for (var i = existingAttrs.length - 1; i >= 0; i--) {
            if (!newNode.hasAttribute(existingAttrs[i].name)) {
              existingNode.removeAttribute(existingAttrs[i].name)
            }
          }

          for (var i = 0; i < newAttrs.length; i++) {
            if (existingNode.getAttribute(newAttrs[i].name) !== newAttrs[i].value) {
              existingNode.setAttribute(newAttrs[i].name, newAttrs[i].value)
            }
          }

          reconcileChildren(existingNode, newNode, 0)
        }
      }

      function addPointer(html, isWritingCode) {
        var pointer = '<div class="pointer"></div>'

        // while a code block is being written (it's the end of the reply), the pointer
        // goes at the end of its code instead of under the block
        if (isWritingCode) {
          var codeEnd = html.lastIndexOf("</code>")
          return html.slice(0, codeEnd) + pointer + html.slice(codeEnd)
        }

        // while a table is being written (it's the end of the reply), the pointer goes
        // at the end of the cell being written (the last one with content before the
        // empty ones, or the first one when a row has just started) instead of under
        // the table. only a reply that ends with a table row can have it there, so the
        // other ones don't need the regex
        if (html.slice(-21) !== "</tr></tbody></table>") {
          return html + pointer
        }
        var pointerInTable = html.replace(
          /<\/td>((?:<td><\/td>)*)<\/tr><\/tbody><\/table>$/,
          pointer + "</td>$1</tr></tbody></table>"
        )

        return pointerInTable !== html ? pointerInTable : html + pointer
      }

      function getCodeBlock(text, start) {
        // the code that starts with the three backticks at start, found with indexOf
        // (much faster than a regex). three backticks closed on the same line (e.g.
        // ```npm install```) are inline code, and a code block starts on the next line
        // and goes until the next three backticks (or until the end while it's being
        // written)
        var backtick = text.indexOf("`", start + 3)
        var lineBreak = text.indexOf("\n", start + 3)
        if (
          backtick > start + 3 &&
          (lineBreak === -1 || backtick < lineBreak) &&
          text.slice(backtick, backtick + 3) === "```"
        ) {
          return { inline: text.slice(start + 3, backtick), end: backtick + 3 }
        }

        var codeStart = lineBreak === -1 ? text.length : lineBreak + 1
        var closing = text.indexOf("```", codeStart)
        if (closing === -1) {
          return { code: text.slice(codeStart), end: text.length, isOpen: true }
        }

        // the line break after the closing three backticks is part of the block
        return {
          code: text.slice(codeStart, closing),
          end: text[closing + 3] === "\n" ? closing + 4 : closing + 3,
        }
      }

      function getStableLength(text) {

        // ones that go together with the next line: the lines of a code block (until the
        // line break after it), a table row ("|"), a quote (">"), an empty line, a title,
        // a divider, the first line with text after a title without text yet (e.g. "##",
        // which takes that line as its text) and a line with a link (a link without http,
        // e.g. [](x), is removed, which can leave the line empty or starting with one of
        // those). the title and the divider take the line break after them, so the next
        // line is converted right after them

        // with other line breaks (\r, \u2028 or \u2029, which some rules take as the end of
        // a line too) the reply isn't cut, so it's converted whole like before
        if (/[\r\u2028\u2029]/.test(text)) {
          return 0
        }

        var fenceIndex = text.indexOf("```")
        while (fenceIndex !== -1) {

          // a code block still being written goes until the end of the text
          var blockEnd = codeBlock.isOpen ? text.length + 1 : codeBlock.end
          codeBlocks.push([fenceIndex, blockEnd])
          fenceIndex = text.indexOf("```", codeBlock.end)
        }

        var isDivider = /^ {0,3}([-*_])(?:[ \t]*\1){2,}[ \t]*$/
        var goesWithNextLine = /^(?:[|>]|\s*$|#{1,6}(?:\s|$))|\]\(/
        var lines = text.split("\n")
        var lineEnd = text.length - lines[lines.length - 1].length
        for (var i = lines.length - 2; i >= 0; i--) {
          var lineStart = lineEnd - lines[i].length - 1
          var isInCodeBlock = codeBlocks.some(function (block) {
            return block[0] < lineEnd && lineEnd <= block[1]
          })

          if (
            !isInCodeBlock &&
            !isDivider.test(lines[i]) &&
            !goesWithNextLine.test(lines[i])
          ) {
            // the line break before a line can be taken by a code block (which goes in the
            // middle of the line where it starts) or by a divider, so the line that ends
            // here starts in the first of those lines
            var first = i
            var firstStart = lineStart
            while (
              first > 0 &&
              (isDivider.test(lines[first - 1]) ||
                codeBlocks.some(function (block) {
                  return block[0] < firstStart && firstStart <= block[1]
                }))
            ) {
              first = first - 1
              firstStart = firstStart - lines[first].length - 1
            }

            // the first line with text after a title without text yet becomes its text
            var previous = first - 1
            while (previous >= 0 && /^\s*$/.test(lines[previous])) {
              previous = previous - 1
            }
            var isTitleText =
              previous >= 0 && /^#{1,6}\s*$|\]\(/.test(lines[previous])

            if (
              !isTitleText &&
              !isDivider.test(lines[first]) &&
              !goesWithNextLine.test(lines[first])
            ) {
              return lineEnd
            }
          }
          lineEnd = lineStart
        }
        return 0
      }

      function renderReply() {
        // the lines that can't change anymore are converted and added to the page only
        // once, so each chunk only converts (and looks for the place of the pointer in,
        // and updates on the page) the lines still being written, however long the
        // reply is
        var pending = reply.slice(stableReplyLength)

        // a line can only be finished by a line break, so without a new one since the
        // last time there are no new finished lines to look for
        var stableLength =
          reply.indexOf("\n", checkedReplyLength) === -1
            ? 0
            : getStableLength(pending)
        checkedReplyLength = reply.length

        if (stableLength > 0) {
          var stableText = pending.slice(0, stableLength)
          var temp = document.createElement("div")
          temp.innerHTML = markdownToHTML(
            stableText.replace(/&/g, "&#38;").replace(/\</g, "&#60;")
          )

          // the lines that just finished take the place of the lines being written,
          // after the ones that finished before
          while (lastReply.childNodes.length > stableReplyNodes) {
            lastReply.removeChild(lastReply.lastChild)
          }
          stableReplyNodes = stableReplyNodes + temp.childNodes.length
          while (temp.firstChild) {
            lastReply.appendChild(temp.firstChild)
          }
          stableReplyLength = stableReplyLength + stableLength
        }

        var writingText = pending.slice(stableLength)

        // a code block still being written (without its closing backticks yet) is the
        // last one of the lines being written
        var isWritingCode = false
        var fenceIndex = writingText.indexOf("```")
        while (fenceIndex !== -1) {
          var codeBlock = getCodeBlock(writingText, fenceIndex)
          isWritingCode = codeBlock.isOpen === true
          fenceIndex = writingText.indexOf("```", codeBlock.end)
        }

        patchDOM(
          lastReply,
          addPointer(
            markdownToHTML(
              writingText.replace(/&/g, "&#38;").replace(/\</g, "&#60;")
            ),
            isWritingCode
          ),
          stableReplyNodes
        )
      }

      function renderReplyFrame(time) {
        // while the reply is received, what arrived so far is shown up to 12 times per
        // second (instead of once per chunk, which can be many more times)
        if (
          time - replyFrameTime >= 1000 / 12 &&
          renderedReplyLength !== reply.length
        ) {
          replyFrameTime = time
          renderedReplyLength = reply.length
          renderReply()
        }
        replyFrame = window.requestAnimationFrame(renderReplyFrame)
      }

      function ask(prompt, hidePrompt) {
        var content = document.querySelector(".content")
        var inputTextbox = document.querySelector(".input_textbox")

        prompt = prompt.trim()
        customPrefix = customPrefix.trim()
        customPrefix = customPrefix ? customPrefix + " " : ""

        if (isMobileDevice()) {
          inputTextbox.blur()
        }

        rendering = true

        var formattedPrompt = prompt
        customPromptRegexRules.forEach(function (rule) {
          formattedPrompt = formattedPrompt.replace(rule.regex, rule.replacement)
        })

        chatHistory.push({ type: "user", text: customPrefix + formattedPrompt })

        lastPrompt = prompt

        var buttonEdit = document.querySelector(".edit_button")

        if (!hidePrompt) {
          var promptContainer = createComponent("div", "prompt_container")
          var promptBackground = createComponent("span", "prompt_background")
          var promptContent = createComponent("div", "prompt_content", "", prompt)
          var editContainer = createComponent("div", "edit_container")
          var buttonCopy = createComponent("button", "action_button")

          // a new prompt discards the unsent changes of the one being edited
          if (document.querySelector(".prompt_background.editing")) {
            endPromptEdit()
          }

          // only the last prompt can be edited, the previous ones only keep their
          // copy button
          if (buttonEdit) {
            buttonEdit.remove()
          }

          promptContainer.setAttribute("role", "article")
          promptContainer.setAttribute("aria-label", t("you"))

          promptContent.addEventListener("keydown", handlePromptKeydown)
          promptContent.addEventListener("input", handlePromptInput)
          promptContent.addEventListener("paste", handlePromptPaste)

          buttonEdit = createComponent("button", "action_button edit_button")
          buttonEdit.type = "button"
          buttonEdit.title = t("edit")
          buttonEdit.appendChild(ICON_EDIT())
          buttonEdit.addEventListener("click", editPrompt)

          buttonCopy.type = "button"
          buttonCopy.title = t("copy")
          buttonCopy.appendChild(ICON_COPY())
          buttonCopy.addEventListener("click", function () {
            copyToClipboard(promptContent, buttonCopy)
            inputTextbox.focus()
          })
          buttonCopy.children[0].classList.add("active")
          buttonCopy.style.cursor = "pointer"

          promptBackground.appendChild(promptContent)
          promptContainer.appendChild(promptBackground)
          editContainer.appendChild(buttonEdit)
          editContainer.appendChild(buttonCopy)
          content.appendChild(promptContainer)
          content.appendChild(editContainer)

          // the previous reply only keeps its copy button, which is the last one
          var actionsContainer = document.querySelector(".actions_container")
          if (actionsContainer) {
            actionsContainer.className = "copy_container"
            while (actionsContainer.children.length > 1) {
              actionsContainer.removeChild(actionsContainer.firstChild)
            }
          }

          lastReply = appendMessage("reply", '<div class="pointer"></div>')

          content.scrollTop = content.scrollHeight
        } else {
          lastReply =
            document.getElementsByClassName("reply")[
              document.getElementsByClassName("reply").length - 1
            ]
          var hasOnlyPointer =
            lastReply.children.length === 1 &&
            lastReply.firstElementChild &&
            lastReply.firstElementChild.classList.contains("pointer")
          if (!hasOnlyPointer) {
            while (lastReply.firstChild) {
              lastReply.removeChild(lastReply.firstChild)
            }
            var pointer = document.createElement("div")
            pointer.className = "pointer"
            lastReply.appendChild(pointer)
          }
        }

        // the last prompt can't be edited while the reply is being generated
        buttonEdit.children[0].classList.remove("active")
        buttonEdit.disabled = true
        buttonEdit.style.cursor = "default"

        document.title = t("title") + " - " + t("thinking")
        // a screen reader says that the reply is on its way
        document.querySelector(".announcer").innerText = t("thinking")

        reply = ""
        stableReplyLength = 0
        stableReplyNodes = 0
        renderedReplyLength = 0
        checkedReplyLength = 0

        worker.postMessage({
          type: "generate",
          chatHistory: chatHistory,
        })

        replyFrame = window.requestAnimationFrame(renderReplyFrame)
      }

      function handleReply(content, replyText, promptResult, prompt) {
        var inputTextbox = document.querySelector(".input_textbox")

        if (replyText === "") {
          setTimeout(function () {
            // removing the last user prompt and re-asking
            chatHistory.pop()
            ask(prompt, true)
          }, 500)
          return
        }

        chatHistory.push({ type: "model", response: [replyText] })
        replies.push(replyText)
        selectedReply = replies.length
        document.title = t("title")

        var actionsContainer = document.querySelector(".actions_container")
        if (actionsContainer) {
          actionsContainer.remove()
        }

        var buttonsContainer = createComponent("div", "actions_container")

        var buttonNext = createComponent("button", "action_button")
        var buttonRegenerate = createComponent("button", "action_button")
        var buttonCopy = createComponent("button", "action_button")
        var buttonEdit = document.querySelector(".edit_button")

        buttonNext.type = "button"
        buttonNext.title = t("next_reply")
        while (buttonNext.firstChild) {
          buttonNext.removeChild(buttonNext.firstChild)
        }
        buttonNext.appendChild(
          document.createTextNode(selectedReply + "/" + replies.length)
        )
        buttonNext.addEventListener("click", function () {
          if (rendering) {
            return
          }

          if (buttonNext.style.display === "none") {
            return
          }

          chatHistory.pop()
          chatHistory.pop()
          var formattedPrompt = prompt
          customPromptRegexRules.forEach(function (rule) {
            formattedPrompt = formattedPrompt.replace(rule.regex, rule.replacement)
          })

          chatHistory.push({ type: "user", text: customPrefix + formattedPrompt })

          if (!replies[selectedReply + 1]) {
            selectedReply = 0
          } else {
            selectedReply = selectedReply + 1
          }

          while (buttonNext.firstChild) {
            buttonNext.removeChild(buttonNext.firstChild)
          }
          buttonNext.appendChild(
            document.createTextNode(selectedReply + 1 + "/" + replies.length)
          )

          var newReply = replies[selectedReply]

          chatHistory.push({ type: "model", response: [newReply] })

          // the reply was already converted while it was written, so switching to it
          // doesn't apply the markdown rules again (slow on phones with long replies)
          promptResult.innerHTML = renderedReplies[selectedReply]
          document.querySelector(".announcer").innerText = promptResult.innerText

          inputTextbox.focus()
        })

        buttonRegenerate.type = "button"
        buttonRegenerate.title = t("regenerate")
        buttonRegenerate.appendChild(ICON_REGENERATE())
        buttonRegenerate.addEventListener("click", function () {
          if (rendering) {
            return
          }

          buttonNext.style.display = "block"
          buttonNext.disabled = true
          while (buttonNext.firstChild) {
            buttonNext.removeChild(buttonNext.firstChild)
          }
          buttonNext.appendChild(
            document.createTextNode(replies.length + 1 + "/" + (replies.length + 1))
          )
          buttonNext.classList.remove("active")

          buttonRegenerate.children[0].classList.remove("active")
          buttonRegenerate.disabled = true
          buttonRegenerate.style.cursor = "default"

          buttonCopy.children[0].classList.remove("active")
          buttonCopy.disabled = true
          buttonCopy.style.cursor = "default"

          chatHistory.pop()
          chatHistory.pop()
          ask(prompt, true)

          inputTextbox.focus()
        })

        buttonCopy.type = "button"
        buttonCopy.title = t("copy")
        buttonCopy.appendChild(ICON_COPY())
        buttonCopy.addEventListener("click", function () {
          copyToClipboard(promptResult, buttonCopy)
          inputTextbox.focus()
        })

        if (replies.length === 1) {
          buttonNext.style.display = "none"
        }

        buttonsContainer.appendChild(buttonNext)
        buttonsContainer.appendChild(buttonRegenerate)
        buttonsContainer.appendChild(buttonCopy)

        buttonNext.classList.add("active")
        buttonNext.disabled = false
        buttonRegenerate.children[0].classList.add("active")
        buttonRegenerate.disabled = false
        buttonRegenerate.style.cursor = "pointer"
        buttonCopy.children[0].classList.add("active")
        buttonCopy.disabled = false
        buttonCopy.style.cursor = "pointer"
        buttonEdit.children[0].classList.add("active")
        buttonEdit.disabled = false
        buttonEdit.style.cursor = "pointer"

        content.appendChild(buttonsContainer)

        var pointerElement = document.querySelector(".pointer")
        if (pointerElement) {
          pointerElement.remove()
        }

        // the converted reply is kept for the next reply button
        renderedReplies.push(promptResult.innerHTML)

        // a screen reader reads the finished reply
        document.querySelector(".announcer").innerText = promptResult.innerText

        rendering = false
      }

      function editPrompt() {
        if (rendering) {
          return
        }

        var prompts = document.querySelectorAll(".prompt_content")
        var promptContent = prompts[prompts.length - 1]
        var selection = window.getSelection()
        var buttonEdit = document.querySelector(".edit_button")
        var buttonCancel = createComponent("button", "action_button active")
        var buttonUpdate = createComponent("button", "action_button")

        buttonCancel.type = "button"
        buttonCancel.title = t("cancel")
        buttonCancel.appendChild(ICON_CANCEL())
        buttonCancel.children[0].classList.add("active")
        buttonCancel.addEventListener("click", endPromptEdit)

        buttonUpdate.type = "button"
        buttonUpdate.title = t("update")
        buttonUpdate.disabled = true
        buttonUpdate.appendChild(ICON_UPDATE())
        buttonUpdate.addEventListener("click", function () {
          updatePrompt(promptContent)
        })

        // the pencil and copy buttons are replaced by the cancel and update buttons
        // at once, so the row of buttons never collapses in between
        buttonEdit.style.display = "none"
        buttonEdit.nextSibling.style.display = "none"
        buttonEdit.parentNode.appendChild(buttonCancel)
        buttonEdit.parentNode.appendChild(buttonUpdate)

        promptBeforeEdit = promptContent.innerText
        promptContent.contentEditable = "true"

        // a screen reader announces the prompt being edited as a text field
        promptContent.setAttribute("role", "textbox")
        promptContent.setAttribute("aria-multiline", "true")
        promptContent.setAttribute("aria-label", t("edit"))

        // the prompt looks like the input textbox while it's being edited
        promptContent.parentNode.classList.add("editing")
        promptContent.focus()

        // moving the caret to the end of the prompt
        selection.selectAllChildren(promptContent)
        selection.collapseToEnd()
      }

      function handlePromptKeydown(event) {
        var promptContent = event.currentTarget

        if (event.key === "Escape") {
          endPromptEdit()
        }

        // enter updates the prompt and shift + enter adds a new line
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault()
          updatePrompt(promptContent)
        }
      }

      function updatePrompt(promptContent) {
        var newPrompt = promptContent.innerText.trim()

        if (rendering || newPrompt === "" || newPrompt === promptBeforeEdit) {
          endPromptEdit()
          return
        }

        var actionsContainer = document.querySelector(".actions_container")

        promptBeforeEdit = newPrompt
        endPromptEdit()

        if (actionsContainer) {
          actionsContainer.remove()
        }

        // replacing the last prompt and removing the last reply
        chatHistory.pop()
        chatHistory.pop()
        replies.splice(0, replies.length)
        renderedReplies.splice(0, renderedReplies.length)
        ask(newPrompt, true)
      }

      function endPromptEdit() {
        var prompts = document.querySelectorAll(".prompt_content")
        var promptContent = prompts[prompts.length - 1]
        var buttonEdit = document.querySelector(".edit_button")
        var editContainer = buttonEdit.parentNode

        // ending the edition discards the unsent changes
        promptContent.contentEditable = "false"
        promptContent.removeAttribute("role")
        promptContent.removeAttribute("aria-multiline")
        promptContent.removeAttribute("aria-label")
        promptContent.innerText = promptBeforeEdit
        promptContent.parentNode.classList.remove("editing")
        document.querySelector(".input_textbox").focus()

        // the cancel and update buttons are replaced by the pencil and copy buttons
        while (editContainer.children.length > 2) {
          editContainer.removeChild(editContainer.lastChild)
        }
        buttonEdit.style.display = ""
        buttonEdit.nextSibling.style.display = ""
      }

      function handlePromptInput(event) {
        var buttonUpdate = document.querySelector(".update").parentNode
        var isChanged = event.currentTarget.innerText.trim() !== promptBeforeEdit

        // the update button is only enabled while the prompt is changed
        buttonUpdate.classList.toggle("active", isChanged)
        buttonUpdate.children[0].classList.toggle("active", isChanged)
        buttonUpdate.disabled = !isChanged
      }

      function handlePromptPaste(event) {
        try {
          // pasting only the plain text, so no html gets into the prompt
          event.preventDefault()

          var text = event.clipboardData.getData("text/plain")
          var selection = window.getSelection()
          var range = selection.getRangeAt(0)

          // replacing the selected text (if any) and leaving the caret after it
          range.deleteContents()
          range.insertNode(document.createTextNode(text))
          range.collapse(false)

          selection.removeAllRanges()
          selection.addRange(range)

          // the pasted text doesn't fire the input event, since it's inserted by hand
          handlePromptInput(event)
        } catch (err) {
          //
        }
      }

      function getCodeCopyButton() {
        // the copy button of a code block, written as html inside the <code>
        var button = createComponent("button", "action_button code_copy active")
        button.type = "button"
        button.title = t("copy")
        button.appendChild(ICON_COPY())
        button.children[0].classList.add("active")
        return button.outerHTML
      }

      function handleCodeCopy(event) {
        // a single listener for every code block, since the replies are rendered
        // again with each new chunk
        var button = event.target.closest(".code_copy")
        if (button) {
          copyToClipboard(button.parentNode, button)
          document.querySelector(".input_textbox").focus()
        }
      }

      function markdownToHTML(markdown) {
        var codeBlocks = []

        // storing and removing all the code blocks (a block that is still being
        // written, without its closing fence yet, goes until the end of the reply).
        // the code block is already a block, so the line break after its closing
        // fence and the last line break of the code (with the indentation of the
        // closing fence, e.g. inside a list) are removed, as they would add empty lines
        var withoutCode = ""
        var codeEnd = 0
        var fenceIndex = markdown.indexOf("```")
        while (fenceIndex !== -1) {
          var fence = getCodeBlock(markdown, fenceIndex)
          if (fence.inline) {
            // three backticks closed on the same line (e.g. ```npm install```) are
            // inline code, not a code block
            withoutCode =
              withoutCode +
              markdown.slice(codeEnd, fenceIndex) +
              "`" +
              fence.inline +
              "`"
          } else {
            // the indentation of the fence (e.g. inside a list) isn't part of the code,
            // so it's removed from every line of the code and from before the block
            // (where it would add an empty line too)
            var fenceStart = fenceIndex
            while (
              fenceStart > codeEnd &&
              (markdown[fenceStart - 1] === " " || markdown[fenceStart - 1] === "\t")
            ) {
              fenceStart = fenceStart - 1
            }
            var indent = markdown.slice(fenceStart, fenceIndex)
            var code = indent
              ? fence.code.replace(new RegExp("^" + indent, "gm"), "")
              : fence.code
            // the last line break of the code is found by hand, since a regex would look
            // for it in the whole code
            var lastBreak = code.lastIndexOf("\n")
            codeBlocks.push(
              lastBreak !== -1 && /^[ \t]*$/.test(code.slice(lastBreak + 1))
                ? code.slice(0, lastBreak)
                : code
            )
            withoutCode =
              withoutCode +
              markdown.slice(codeEnd, fenceStart) +
              "%%CODELLAMABLOCK" +
              (codeBlocks.length - 1) +
              "%%"
          }
          codeEnd = fence.end
          fenceIndex = markdown.indexOf("```", codeEnd)
        }
        markdown = withoutCode + markdown.slice(codeEnd)

        // storing and removing all the inline code (so it's not touched by the
        // emphasis rules below, e.g. __init__ becoming <strong>init</strong>). it can
        // be opened with several backticks to have a backtick inside (e.g. ``a`b``),
        // and it ends with exactly the same number of them
        var inlineCodes = []
        markdown = markdown.replace(
          /(^|[^`])(`+)(?!`)([^\n]*?[^`\n])\2(?!`)/g,
          function (_match, before, _ticks, inlineCode) {
            inlineCodes.push(inlineCode)
            return before + "%%CODELLAMAINLINE" + (inlineCodes.length - 1) + "%%"
          }
        )

        // storing and removing all the links (so their urls are not touched by the
        // emphasis rules below, e.g. an underscore inside a url becoming <em>)
        var links = []
        // (a url can have parentheses inside, e.g. wikipedia's /wiki/Python_(language))
        markdown = markdown.replace(
          /\[(.*?)\]\(((?:[^()\n]|\([^()\n]*\))*)\)/g,
          function (_match, text, url) {
            // only the http and https urls become links (a javascript url
            // would run code when clicked), and a quote can't close the href
            if (!/^https?:\/\//i.test(url)) {
              return text
            }
            url = url.replace(/"/g, "%22")
            links.push('<a href="' + url + '" target="_blank">' + text + "</a>")
            return "%%CODELLAMALINK" + (links.length - 1) + "%%"
          }
        )

        // storing and removing the urls written without the markdown format (e.g.
        // https://www.example.com), which become links too
        markdown = markdown.replace(
          /https?:\/\/(?:(?!%%CODELLAMA)[^\s<])+/g,
          function (url) {
            // the punctuation after a url (e.g. the period that ends a sentence) is not
            // part of it, and neither is a closing parenthesis without its opening one
            var trailing = ""
            while (
              /[.,;:!?'"*]$/.test(url) ||
              (/\)$/.test(url) && url.split("(").length < url.split(")").length)
            ) {
              trailing = url.slice(-1) + trailing
              url = url.slice(0, -1)
            }
            var href = url.replace(/"/g, "%22")
            links.push('<a href="' + href + '" target="_blank">' + url + "</a>")
            return "%%CODELLAMALINK" + (links.length - 1) + "%%" + trailing
          }
        )

        // parsing markdown tables (the rows that are still being written, without
        // their last "|" yet, are already part of the table). like github, a table can
        // have only its header and its separator, without rows yet (once the
        // separator line is complete, so it doesn't flicker while it's being written)
        markdown = markdown.replace(
          /^(\|.+\|)\r?\n(\|[-: \t|]+\|)[ \t]*(?:\r?\n((?:\|.*(?:\r?\n|$))+)|\r?\n)/gm,
          function (match, headerRow, separatorRow, bodyRows) {
            function parseRow(row) {
              // a row still being written (without its last "|") keeps its last cell
              return row
                .split("|")
                .slice(1, /\|\s*$/.test(row) ? -1 : undefined)
                .map(function (cell) {
                  return cell.trim()
                })
            }

            var headers = parseRow(headerRow)

            // without rows yet, it's a table only once its separator has as many columns
            // as its header (like github), so a separator still being written isn't one
            if (!bodyRows && parseRow(separatorRow).length !== headers.length) {
              return match
            }

            // (a table without rows yet has none, instead of an empty one)
            var rows = (bodyRows || "")
              .trim()
              .split(/\r?\n/)
              .filter(function (row) {
                return row !== ""
              })
              .map(function (row) {
                return parseRow(row)
              })

            var html = "<table><thead><tr>"
            headers.forEach(function (header) {
              html = html + "<th>" + header + "</th>"
            })
            html = html + "</tr></thead><tbody>"
            rows.forEach(function (row) {
              // the row has all the columns of the table, even while its first cells are
              // still being written
              while (row.length < headers.length) {
                row.push("")
              }

              html = html + "<tr>"
              row.forEach(function (cell) {
                html = html + "<td>" + cell + "</td>"
              })
              html = html + "</tr>"
            })
            html = html + "</tbody></table>"
            return html
          }
        )

        // setting the markdown rules
        var rules = [
          { regex: /^---$\n?/gm, replacement: "<hr>" },
          // the other ways to write that line (e.g. ***, ___, ----, - - - or * * *), only
          // once the line is complete, so a line that starts with *** (bold and italic)
          // isn't a line for a moment while it's being written
          { regex: /^ {0,3}([-*_])(?:[ \t]*\1){2,}[ \t]*\n/gm, replacement: "<hr>" },
          // before the emphasis rules, so the asterisk of a bullet isn't an <em>.
          // the indented bullets (sublists) keep their indentation, and the spaces
          // after the bullet (e.g. "*   text") become just one
          {
            regex: /^([ \t]*)[\*\-\+][ \t]+(.+)$/gm,
            replacement: function replacement(_match, bulletIndent, item) {
              return bulletIndent + "&#8226; " + item
            },
          },
          // the asterisks must be next to the text, so 5 * 3 * 2 isn't an emphasis
          {
            regex: /\*\*([^\s*](?:.*?[^\s*])?)\*\*/g,
            replacement: "<strong>$1</strong>",
          },
          { regex: /\*([^\s*](?:.*?[^\s*])?)\*/g, replacement: "<em>$1</em>" },
          // the underscores inside a word (e.g. my_var_name) are not an emphasis
          { regex: /\b__(.*?)__\b/g, replacement: "<strong>$1</strong>" },
          { regex: /\b_(.*?)_\b/g, replacement: "<em>$1</em>" },
          // ~~text~~ is a strikethrough (the tildes must be next to the text too)
          { regex: /~~([^\s~](?:.*?[^\s~])?)~~/g, replacement: "<del>$1</del>" },
          // the title is already a block, so the line break after it is removed (like
          // the one after the <hr>), as it would add an empty line
          {
            regex: /^(#{1,6})\s+(.*)$\n?/gm,
            replacement: function replacement(_match, hashes, content) {
              return (
                "<h" + hashes.length + ">" + content + "</h" + hashes.length + ">"
              )
            },
          },
          // the lines that start with ">" are a quote
          {
            regex: /^(?:> ?.*(?:\n|$))+/gm,
            replacement: function replacement(match) {
              return (
                "<blockquote>" +
                match.replace(/\n$/, "").replace(/^> ?/gm, "") +
                "</blockquote>"
              )
            },
          },
        ]

        rules = rules.concat(customResponseRegexRules)

        // applying the markdown rules
        rules.forEach(function (rule) {
          markdown = markdown.replace(rule.regex, rule.replacement)
        })

        // restoring all the links
        markdown = markdown.replace(
          /%%CODELLAMALINK(\d+)%%/g,
          function (_match, index) {
            return links[index]
          }
        )

        // restoring all the inline code
        markdown = markdown.replace(
          /%%CODELLAMAINLINE(\d+)%%/g,
          function (_match, index) {
            return '<div class="highlighted">' + inlineCodes[index] + "</div>"
          }
        )

        // restoring all the code blocks, each one with its copy button
        markdown = markdown.replace(
          /%%CODELLAMABLOCK(\d+)%%/g,
          function (_match, index) {
            var blockCode = codeBlocks[index].replace(/```/g, "")
            return "<code>" + getCodeCopyButton() + blockCode + "</code>"
          }
        )

        return markdown
      }

      function isMobileDevice() {
        return !!(
          window.navigator.userAgent.match(/Android/i) ||
          window.navigator.userAgent.match(/webOS/i) ||
          window.navigator.userAgent.match(/iPhone/i) ||
          window.navigator.userAgent.match(/iPad/i) ||
          window.navigator.userAgent.match(/iPod/i) ||
          window.navigator.userAgent.match(/BlackBerry/i) ||
          window.navigator.userAgent.match(/Windows Phone/i)
        )
      }

      function isUsingiOS() {
        return !!(
          window.navigator.userAgent.match(/iPhone/i) ||
          window.navigator.userAgent.match(/iPad/i) ||
          window.navigator.userAgent.match(/iPod/i)
        )
      }

      function getLineHeight(element) {
        var fontSize = parseFloat(window.getComputedStyle(element).fontSize)

        var multipliers = {
          desktop: 1.09,
          android: 1.14,
          ios: 1.17,
        }

        if (isMobileDevice()) {
          if (isUsingiOS()) {
            return fontSize * multipliers.ios
          }
          return fontSize * multipliers.android
        }

        return fontSize * multipliers.desktop
      }

      function resizeInputText() {
        try {
          var content = document.querySelector(".content")
          var footerContainer = document.querySelector(".footer_container")
          var inputTextbox = document.querySelector(".input_textbox")

          // checked before resizing, so a user at the bottom stays at the bottom
          var pixelsLeft =
            content.scrollHeight - (content.scrollTop + content.clientHeight)
          var isAtBottom = pixelsLeft <= 1

          inputTextbox.rows = 1
          inputTextbox.style.height = "auto"

          var lineHeight = getLineHeight(inputTextbox)
          var scrollHeight = inputTextbox.scrollHeight

          var correction = inputTextbox.offsetHeight - inputTextbox.clientHeight

          var newHeight = scrollHeight - correction
          var maxHeight = lineHeight * 5

          if (newHeight > maxHeight) {
            newHeight = maxHeight
          }

          inputTextbox.style.height = newHeight + "px"

          // the chat scrolls inside the content, which ends where the footer starts.
          // the window itself never scrolls, because on ios scrolling it while the
          // keyboard is open makes the whole page jump
          content.style.bottom = footerContainer.offsetHeight + "px"

          if (isAtBottom) {
            content.scrollTop = content.scrollHeight
          }
        } catch (err) {
          //
        }
      }

      function sendPrompt() {
        var inputTextbox = document.querySelector(".input_textbox")
        var inputSend = document.querySelector(".input_send")
        var prompt = inputTextbox.value.trim()

        // the prompt is sent with enter or with the send button, but not while a
        // reply is being generated
        if (rendering) {
          return
        }

        if (prompt) {
          replies.splice(0, replies.length)
          renderedReplies.splice(0, renderedReplies.length)
          ask(prompt)
        }

        inputTextbox.value = ""
        if (isMobileDevice()) {
          inputTextbox.blur()
        }
        resizeInputText()
        if (inputSend.classList.contains("active")) {
          inputSend.classList.remove("active")
          inputSend.disabled = true
        }
      }

      // the model is downloaded in chunks using Range requests, and every chunk
      // is copied into one ArrayBuffer allocated with the final size. a single
      // XHR with responseType "arraybuffer" keeps every received piece and then
      // copies all of them into a new ArrayBuffer, so for a moment the model is
      // twice in RAM and ios safari runs out of memory. no fetch here because
      // the entire project is compatible with pre 2015 environments.
      var DOWNLOAD_CHUNK_SIZE = 16777216

      function downloadFile(url, button, content) {
        content.removeChild(button)

        var downloadStatus = appendMessage("reply", t("downloading") + " 0%")

        function showProgress(loaded, total) {
          var percent = Math.round((loaded / total) * 100)
          downloadStatus.innerText = t("downloading") + " " + percent + "%"
        }

        function showError() {
          downloadStatus.innerText = t("error_download")
        }

        // the HEAD request gets the final size and the url after the redirects
        var head = new XMLHttpRequest()
        head.open("HEAD", url, true)

        head.addEventListener("load", function () {
          var total = parseInt(head.getResponseHeader("Content-Length"), 10)

          // without the final size the buffer can't be allocated up front
          if (head.status !== 200 || !(total > 0)) {
            downloadFileXHR(url, showProgress, showError)
            return
          }

          if (total >= 2147483648) {
            downloadStatus.innerText = t("error_filesize")
            return
          }

          downloadFileChunks(head.responseURL || url, total, showProgress, showError)
        })

        head.addEventListener("error", function () {
          downloadFileXHR(url, showProgress, showError)
        })

        head.send()
      }

      function downloadFileChunks(url, total, showProgress, showError) {
        var buffer = null

        try {
          buffer = new ArrayBuffer(total)
        } catch (err) {
          showError()
          return
        }

        var bytes = new Uint8Array(buffer)
        var loaded = 0

        function downloadChunk() {
          var end = Math.min(loaded + DOWNLOAD_CHUNK_SIZE, total) - 1

          var xhr = new XMLHttpRequest()
          xhr.open("GET", url, true)
          xhr.responseType = "arraybuffer"
          xhr.setRequestHeader("Range", "bytes=" + loaded + "-" + end)

          xhr.addEventListener("progress", function (event) {
            showProgress(loaded + event.loaded, total)
          })

          xhr.addEventListener("load", function () {
            var chunk = xhr.response

            // the server ignored the Range header and sent the entire file
            if (xhr.status === 200 && chunk && chunk.byteLength === total) {
              initialize(chunk)
              return
            }

            if (
              xhr.status !== 206 ||
              !chunk ||
              chunk.byteLength !== end - loaded + 1
            ) {
              showError()
              return
            }

            bytes.set(new Uint8Array(chunk), loaded)
            loaded = end + 1

            if (loaded < total) {
              downloadChunk()
            } else {
              initialize(buffer)
            }
          })

          xhr.addEventListener("error", showError)

          xhr.send()
        }

        downloadChunk()
      }

      function downloadFileXHR(url, showProgress, showError) {
        var xhr = new XMLHttpRequest()
        xhr.open("GET", url, true)
        xhr.responseType = "arraybuffer"

        xhr.addEventListener("progress", function (event) {
          if (event.lengthComputable) {
            showProgress(event.loaded, event.total)
          }
        })

        xhr.addEventListener("load", function () {
          if (xhr.status === 200) {
            initialize(xhr.response)
          } else {
            showError()
          }
        })

        xhr.addEventListener("error", showError)

        xhr.send()
      }

      document.addEventListener("click", handleCodeCopy)

      window.addEventListener("load", function () {
        if (window.top === window.self) {
          var pleaseWait = document.querySelector(".pleasewait")
          var container = document.getElementById("container")
          var uploader = document.querySelector('input[type="file"]')
          var content = document.querySelector(".content")
          var headerName = document.querySelector(".header_name")
          var inputContainer = document.querySelector(".input_container")
          var inputTextbox = document.querySelector(".input_textbox")
          var inputSend = document.querySelector(".input_send")
          var labelDisclaimer = document.querySelector(".disclaimer")

          document.title = t("title")
          headerName.innerText = t("title")

          labelDisclaimer.style.display = "none"

          while (content.firstChild) {
            content.removeChild(content.firstChild)
          }

          uploader.addEventListener("change", function (event) {
            initialize(event.target.files)
          })

          var buttonUpload = document.createElement("input")
          buttonUpload.className = "input_upload"
          buttonUpload.type = "button"
          buttonUpload.value = t("upload")
          buttonUpload.addEventListener("click", function () {
            uploader.click()
          })
          content.appendChild(buttonUpload)

          var buttonDemo1 = document.createElement("button")
          buttonDemo1.className = "input_upload"
          buttonDemo1.type = "button"
          buttonDemo1.innerText = t("download") + " Gemma 3 1B"
          buttonDemo1.addEventListener("click", function () {
            content.removeChild(buttonUpload)
            content.removeChild(buttonDemo2)
            downloadFile(
              "https://huggingface.co/unsloth/gemma-3-1b-it-GGUF/resolve/main/gemma-3-1b-it-Q8_0.gguf?download=true",
              buttonDemo1,
              content
            )
          })
          content.appendChild(buttonDemo1)

          var buttonDemo2 = document.createElement("button")
          buttonDemo2.className = "input_upload"
          buttonDemo2.type = "button"
          buttonDemo2.innerText = t("download") + " Gemma 3 270M"
          buttonDemo2.addEventListener("click", function () {
            content.removeChild(buttonUpload)
            content.removeChild(buttonDemo1)
            downloadFile(
              "https://huggingface.co/unsloth/gemma-3-270m-it-GGUF/resolve/main/gemma-3-270m-it-Q8_0.gguf?download=true",
              buttonDemo2,
              content
            )
          })
          content.appendChild(buttonDemo2)

          inputTextbox.placeholder = t("placeholder")
          // the names a screen reader announces for the textbox and the send button
          inputTextbox.setAttribute("aria-label", t("placeholder"))
          inputSend.title = t("send")
          inputSend.disabled = true
          inputTextbox.value = ""
          window.addEventListener("resize", resizeInputText)
          inputTextbox.addEventListener("input", resizeInputText)
          inputTextbox.addEventListener("keydown", function (event) {
            // enter sends the prompt and shift + enter adds a new line
            if (event.key === "Enter" && !event.shiftKey) {
              event.preventDefault()
              sendPrompt()
            }
          })
          inputTextbox.addEventListener("input", function () {
            // the send button is only enabled while the textbox has text
            if (inputTextbox.value.length > 0) {
              inputSend.classList.add("active")
              inputSend.disabled = false
            } else {
              inputSend.classList.remove("active")
              inputSend.disabled = true
            }
          })

          inputSend.addEventListener("click", sendPrompt)

          inputContainer.addEventListener("click", function () {
            inputTextbox.focus()
          })

          var headerTheme = document.querySelector(".header_theme")
          var themeOverlay = document.querySelector(".theme_overlay")
          var themeMenu = document.querySelector(".theme_menu")
          var styleNode = document.createElement("style")
          styleNode.appendChild(document.createTextNode(STYLES_ALL))
          document.head.appendChild(styleNode)

          // the gear of the header opens the menu of themes: automatic, light or dark
          headerTheme.title = t("settings")
          document.getElementById("theme_title").innerText = t("theme")
          themeMenu.querySelector("[data-theme=auto]").innerText = t("theme_auto")
          themeMenu.querySelector("[data-theme=light]").innerText = t("theme_light")
          themeMenu.querySelector("[data-theme=dark]").innerText = t("theme_dark")
          headerTheme.addEventListener("click", function () {
            themeOverlay.classList.add("active")
            headerTheme.setAttribute("aria-expanded", "true")
            // the focus goes to the first option of the menu
            themeMenu.querySelector(".theme_option").focus()
          })
          // the menu goes away with a click or a tap anywhere, and with a scroll
          themeOverlay.addEventListener("click", closeThemeMenu)
          themeOverlay.addEventListener("wheel", closeThemeMenu)
          themeOverlay.addEventListener("touchmove", closeThemeMenu)
          content.addEventListener("scroll", closeThemeMenu)
          themeMenu.addEventListener("click", function (event) {
            var theme = event.target.getAttribute("data-theme")
            if (!theme) {
              return
            }
            if (theme === "light") {
              styleNode.textContent = STYLES_LIGHT_MODE
            } else if (theme === "dark") {
              styleNode.textContent = STYLES_DARK_MODE
            } else {
              styleNode.textContent = STYLES_ALL
            }
            checkThemeOption(event.target)
          })
          // enter or space on an option of the menu chooses it, and escape closes the menu
          themeMenu.addEventListener("keydown", function (event) {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault()
              event.target.click()
            } else if (event.key === "Escape") {
              closeThemeMenu()
            }
          })
          // the menu goes away when the focus leaves its options
          themeMenu.addEventListener("focusout", function (event) {
            if (!themeMenu.contains(event.relatedTarget)) {
              closeThemeMenu()
            }
          })

          // the menu also has the context size, which goes with the next model that
          // is loaded
          document.getElementById("context_title").innerText = t("context")
          themeMenu.querySelector("[data-context='0']").innerText = t("context_max")
          themeMenu.addEventListener("click", function (event) {
            var context = event.target.getAttribute("data-context")
            if (context && event.target.getAttribute("aria-disabled") !== "true") {
              CONTEXT_SIZE = parseInt(context)
              checkThemeOption(event.target)
            }
          })

          pleaseWait.style.display = "none"
          container.style.display = "block"

          resizeInputText()
        }
      })
    </script>
